<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>lonny cocoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#18253d; --ink:#0e1626; --cream:#f4e8b4; --blue:#2c5a94; --lime:#cdd16f; --peach:#e6966c; --muted:#9aa9c0;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--navy)}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--navy);color:var(--cream);font-family:"Source Sans 3",system-ui,sans-serif;font-size:1.0625rem;line-height:1.5}
header{padding:2.5rem 1.5rem 0;text-align:center}
h1{margin:0;font-weight:900;font-size:clamp(2.8rem,12vw,4.75rem);line-height:.95;letter-spacing:-.025em}
.sub{margin:.9rem 0 0;color:var(--muted);font-weight:600;font-size:1.1rem}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:2.5rem 1.5rem 3rem}
.cards{display:flex;flex-wrap:wrap;gap:1.75rem;justify-content:center;width:100%;max-width:60rem}
.status{color:var(--muted);font-weight:600}
.card{width:100%;max-width:15rem;background:var(--cream);color:var(--ink);padding:.65rem .65rem 1rem;border-radius:2px}
.cover{position:relative;aspect-ratio:1;overflow:hidden;background:var(--cream)}
.cover img{display:block;width:100%;height:100%;object-fit:cover}
.disc{position:absolute;inset:5%;border-radius:50%;
  background:
    conic-gradient(from 20deg,transparent 0 8%,rgba(255,255,255,.14) 14%,transparent 24% 50%,rgba(255,255,255,.14) 64%,transparent 74%),
    repeating-radial-gradient(circle,#0e1626 0 2px,#1b2740 2px 3px)}
.disc::before{content:"";position:absolute;inset:34%;border-radius:50%;background:var(--lab,var(--blue))}
.disc::after{content:"";position:absolute;inset:47.5%;border-radius:50%;background:var(--cream)}
.card:hover .disc{animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.card:hover .disc{animation:none}}
.card h2{margin:.9rem .15rem 0;font-weight:900;font-size:1.9rem;line-height:1.05;letter-spacing:-.015em}
.card p{margin:.1rem .15rem .8rem;color:#4b5670;font-size:.95rem}
.links{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 .15rem}
.links a{color:var(--cream);background:var(--navy);padding:.25rem .75rem;border-radius:99px;text-decoration:none;font-size:.9rem;font-weight:600}
.links a:hover{background:var(--blue)}
a:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.card a:focus-visible{outline-color:var(--blue)}
footer{padding:0 1.5rem 2.5rem;text-align:center;color:var(--muted);font-size:.95rem}
footer a{color:var(--cream);margin:0 .6rem;text-underline-offset:.25em;text-decoration-thickness:1px;font-weight:600}
footer a:hover{color:var(--lime)}
</style>
</head>
<body>
<header>
  <h1>lonny cocoon</h1>
  <p class="sub">Audio</p>
</header>

<main>
  <div class="cards" id="cards" aria-live="polite"><p class="status">Loading audio…</p></div>
</main>

<footer>
  <a href="https://open.spotify.com/intl-ar/artist/2VlAixpjMhZHEjXmwmjEd7" target="_blank" rel="noopener">Spotify</a>
  <a href="https://www.youtube.com/@lonny.cocoon" target="_blank" rel="noopener">YouTube</a>
  <a href="https://www.instagram.com/lonny.cocoon" target="_blank" rel="noopener">Instagram</a>
</footer>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRRbwiag08mbEM7VifXGVx5y8wCkarQSNcr4Ug7-2gbofo31SUHsiJrv61F5W1-gFzISBVkSlTGcJuB/pub?output=csv";

/* Column names the page recognises (not case sensitive).
   Any other column that contains a web link becomes a button named after its header. */
const TITLE = ["title","song","name","track"];
const COVER = ["cover","cover art","coverart","artwork","art","image","img","photo"];
const SUB   = ["type","subtitle","kind","album","year","release","date"];
const LABELS = ["var(--blue)","var(--peach)","var(--lime)"];

function parseCSV(t){
  const rows=[]; let r=[], f="", q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"') q=true;
    else if(c===","){ r.push(f); f="" }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&t[i+1]==="\n")i++; r.push(f); rows.push(r); r=[]; f="" }
    else f+=c;
  }
  if(f!==""||r.length){ r.push(f); rows.push(r) }
  return rows;
}
const isUrl = v => /^https?:\/\//i.test(v);
function coverUrl(v){
  const m = v.match(/drive\.google\.com\/file\/d\/([^/]+)/) || v.match(/drive\.google\.com\/open\?id=([^&]+)/);
  return m ? "https://drive.google.com/thumbnail?id="+m[1]+"&sz=w600" : v;
}
function el(tag, cls, text){ const e=document.createElement(tag); if(cls)e.className=cls; if(text)e.textContent=text; return e }
function disc(i){ const d=el("div","disc"); d.style.setProperty("--lab",LABELS[i%LABELS.length]); return d }

function card(row, headers, i){
  const get = names => { const h=headers.find(h=>names.includes(h.toLowerCase())); return h ? (row[h]||"").trim() : "" };
  const title = get(TITLE); if(!title) return null;
  const used = new Set(headers.filter(h=>[...TITLE,...COVER,...SUB].includes(h.toLowerCase())));

  const a = el("article","card");
  const cover = el("div","cover"); cover.setAttribute("role","img");
  const cu = get(COVER);
  if(isUrl(cu)){
    cover.setAttribute("aria-label","Cover art for "+title);
    const img = new Image(); img.alt=""; img.loading="lazy"; img.referrerPolicy="no-referrer";
    img.onerror = () => { img.remove(); cover.setAttribute("aria-label","Vinyl record"); cover.appendChild(disc(i)) };
    img.src = coverUrl(cu); cover.appendChild(img);
  } else { cover.setAttribute("aria-label","Vinyl record, no cover art yet"); cover.appendChild(disc(i)) }
  a.appendChild(cover);
  a.appendChild(el("h2","",title));
  const sub = get(SUB); if(sub) a.appendChild(el("p","",sub));

  const links = el("div","links");
  headers.forEach(h=>{
    if(used.has(h)) return;
    const v=(row[h]||"").trim();
    if(isUrl(v)){ const l=el("a","",h); l.href=v; l.target="_blank"; l.rel="noopener"; links.appendChild(l) }
  });
  if(links.children.length) a.appendChild(links);
  return a;
}

async function load(){
  const box = document.getElementById("cards");
  try{
    const res = await fetch(SHEET_URL);
    if(!res.ok) throw new Error(res.status);
    const rows = parseCSV(await res.text()).filter(r=>r.some(c=>c.trim()));
    const headers = (rows.shift()||[]).map(h=>h.trim());
    const cards = rows.map(r=>{ const o={}; headers.forEach((h,i)=>o[h]=r[i]||""); return o })
                      .map((o,i)=>card(o,headers,i)).filter(Boolean);
    box.textContent = "";
    if(!cards.length){ box.appendChild(el("p","status","No audio yet.")); return }
    cards.forEach(c=>box.appendChild(c));
  }catch(e){
    box.textContent = "";
    box.appendChild(el("p","status","Couldn't load the audio. Please try again soon."));
  }
}
load();
</script>
</body>
</html>
