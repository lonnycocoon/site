<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lonny cocoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo+Narrow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b2a49;--cream:#f4ead5;--paper:#efe3c9;--orange:#f5a623;--ink:#14110f;--rose:#c9786a}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--navy);font-family:"Archivo Narrow",Arial,sans-serif;padding-bottom:110px;
 background-image:radial-gradient(rgba(27,42,73,.07) 1px,transparent 1px);background-size:6px 6px}
.heavy{font-family:"Archivo Black","Arial Black",Impact,sans-serif;text-transform:lowercase}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 5vw}
header .logo{font-size:1.3rem;color:var(--navy);text-decoration:none}
nav a{margin-left:20px;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);text-decoration:none;border-bottom:1px solid transparent}
nav a:hover{border-color:var(--navy)}
.hero{text-align:center;padding:30px 5vw 10px}
.hero .count{font-size:1.6rem;font-family:"Archivo Black",sans-serif}
.hero h1{font-size:clamp(2.2rem,6vw,3.8rem);letter-spacing:.02em;line-height:1}
.hero small{display:block;margin-top:8px;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
.bar{max-width:520px;margin:34px auto 0;display:flex;gap:0;height:2px;background:rgba(27,42,73,.2)}
.bar i{display:block;background:var(--navy);transition:width .4s}
.stage{display:flex;align-items:center;justify-content:center;gap:4vw;padding:40px 5vw 20px;max-width:1100px;margin:0 auto}
.arrow{background:none;border:0;font-size:2.4rem;color:var(--navy);cursor:pointer;padding:10px;transition:transform .2s}
.arrow:hover{transform:scale(1.2)}
.info{width:230px;text-align:left}
.info .by{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.info h2{font-size:1.5rem;line-height:1.5;margin:8px 0 18px}
.info h2 span{background:var(--ink);color:var(--cream);padding:2px 9px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.info dl{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;line-height:1.9}
.info dt{display:inline;font-weight:600}
.info dd{display:inline;opacity:.75}
.info dd a{color:inherit}
.rule{width:34px;height:3px;background:var(--navy);margin:14px 0}
.playbtn{margin-top:18px;background:var(--orange);color:var(--ink);border:0;padding:11px 20px;font:inherit;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;display:inline-flex;gap:10px;align-items:center}
.playbtn:disabled{background:rgba(27,42,73,.12);color:rgba(27,42,73,.6);cursor:default}
.sleeve{position:relative;width:min(340px,70vw);aspect-ratio:1;flex:none;margin-right:18%}
.record{position:absolute;top:2%;right:-36%;width:96%;aspect-ratio:1;border-radius:50%;
 background:repeating-radial-gradient(circle at center,#0d0d0d 0 2px,#1b1b1b 2px 4px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.record::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent,rgba(255,255,255,.12),transparent 30%,transparent 50%,rgba(255,255,255,.1),transparent 80%)}
.record::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--orange);box-shadow:0 0 0 12px #0d0d0d inset,0 0 0 1px #000}
.spin .record{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cover{position:relative;width:100%;height:100%;box-shadow:0 10px 30px rgba(20,17,15,.35);background:var(--navy) center/cover}
.cover.novinyl{background:radial-gradient(circle,var(--orange) 0 9%,#0d0d0d 9.5% 10%,#161616 10.5%),repeating-radial-gradient(circle,#0d0d0d 0 2px,#1b1b1b 2px 4px)}
.cover.fade{animation:fadein .5s}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
.tag{position:absolute;right:-14px;bottom:-14px;background:var(--orange);color:var(--ink);width:74px;height:74px;border-radius:50%;display:grid;place-items:center;text-align:center;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;line-height:1.3;transform:rotate(-8deg)}
.viewall{display:block;margin:30px auto 0;background:rgba(27,42,73,.1);color:var(--navy);border:0;padding:20px 64px;font:inherit;font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;cursor:pointer}
.viewall:hover{background:rgba(27,42,73,.2)}
#all{padding:70px 5vw 40px;max-width:1100px;margin:0 auto}
#all h3{font-size:2rem;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:26px}
.card{cursor:pointer;background:var(--paper);padding:12px;border:0;text-align:left;font:inherit;color:inherit;transition:transform .2s}
.card:hover{transform:translateY(-4px) rotate(-.6deg)}
.card .c{aspect-ratio:1;background:var(--navy) center/cover}
.card .c.novinyl{background:radial-gradient(circle,var(--orange) 0 9%,#0d0d0d 9.5% 10%,#161616 10.5%),repeating-radial-gradient(circle,#0d0d0d 0 2px,#1b1b1b 2px 4px)}
.card b{display:block;margin-top:10px;font-family:"Archivo Black",sans-serif;text-transform:lowercase;font-size:.95rem;font-weight:400}
.card span{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
footer{text-align:center;padding:60px 5vw 30px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase}
footer a{color:var(--navy);margin:0 12px}
#player{position:fixed;left:2.5vw;right:2.5vw;bottom:16px;background:var(--orange);color:var(--ink);display:flex;align-items:center;gap:16px;padding:12px 18px;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translateY(160%);transition:transform .4s}
#player.on{transform:none}
#player button{background:none;border:0;color:var(--ink);cursor:pointer;font-size:1rem;padding:4px 6px}
#pp{width:38px;height:38px;border-radius:50%;background:#fff!important;display:grid;place-items:center;font-size:.9rem!important}
.now{min-width:130px;line-height:1.2}
.now small{display:block;font-size:.55rem;letter-spacing:.14em;text-transform:uppercase}
.now b{font-family:"Archivo Black",sans-serif;font-weight:400;text-transform:lowercase;font-size:.9rem}
.seek{flex:1;display:flex;align-items:center;gap:10px;font-size:.62rem;letter-spacing:.08em}
.seek input{flex:1;accent-color:var(--ink);cursor:pointer}
#x{border:1.5px solid var(--ink)!important;border-radius:50%;width:32px;height:32px}
.msg{text-align:center;padding:60px 5vw;opacity:.7}
@media(max-width:820px){
 .stage{flex-direction:column;gap:20px;padding-top:24px}
 .sleeve{margin-right:0;width:min(280px,64vw)}.record{right:-22%}
 .info{width:100%;max-width:340px;text-align:center}.info h2{font-size:1.25rem}
 .arrows{display:flex;gap:40px}
 .now{min-width:0;flex:1}.seek .t{display:none}
}
</style>
</head>
<body>
<header>
  <a class="logo heavy" href="#">lonny cocoon</a>
  <nav><a href="#top">audio</a><a href="#all">view all</a><a href="https://www.instagram.com/lonny.cocoon" target="_blank" rel="noopener">instagram</a></nav>
</header>

<section class="hero" id="top">
  <div class="count" id="count">&nbsp;</div>
  <h1 class="heavy">audio</h1>
  <small>songs by lonny cocoon</small>
  <div class="bar"><i id="prog" style="width:0"></i></div>
</section>

<div id="msg" class="msg">loading songs…</div>

<section class="stage" id="stage" hidden>
  <button class="arrow" id="prev" aria-label="Previous">←</button>
  <div class="info">
    <div class="by">by lonny cocoon</div>
    <h2 class="heavy"><span id="title"></span></h2>
    <div class="rule"></div>
    <dl id="meta"></dl>
    <button class="playbtn" id="listen"></button>
  </div>
  <div class="sleeve" id="sleeve">
    <div class="record"></div>
    <div class="cover" id="cover"></div>
    <div class="tag" id="tag">single</div>
  </div>
  <button class="arrow" id="next" aria-label="Next">→</button>
</section>

<button class="viewall" id="va" hidden>view all</button>

<section id="all" hidden>
  <h3 class="heavy">all audio</h3>
  <div class="grid" id="grid"></div>
</section>

<footer>
  <a href="https://www.instagram.com/lonny.cocoon" target="_blank" rel="noopener">instagram</a>
  <a href="https://www.youtube.com/@lonny.cocoon" target="_blank" rel="noopener">youtube</a>
  <a href="https://open.spotify.com/intl-ar/artist/2VlAixpjMhZHEjXmwmjEd7" target="_blank" rel="noopener">spotify</a>
  <div style="margin-top:20px;opacity:.6">© lonny cocoon</div>
</footer>

<div id="player" aria-label="Audio player">
  <button id="pb" aria-label="Previous song">⏮</button>
  <button id="pp" aria-label="Play or pause">▶</button>
  <button id="pn" aria-label="Next song">⏭</button>
  <div class="now"><small>lonny cocoon</small><b id="ptitle"></b></div>
  <div class="seek"><span id="cur">0:00</span><input id="range" type="range" min="0" max="100" value="0" step=".1"><span class="t" id="dur">0:00</span></div>
  <button id="x" aria-label="Close player">✕</button>
</div>
<audio id="audio" preload="none"></audio>

<script>
const SHEET="https://docs.google.com/spreadsheets/d/e/2PACX-1vRRbwiag08mbEM7VifXGVx5y8wCkarQSNcr4Ug7-2gbofo31SUHsiJrv61F5W1-gFzISBVkSlTGcJuB/pub?output=csv";
// Shown only if the sheet can't be reached (e.g. opened offline)
const FALLBACK=`Title,Artwork,Spotify,YouTube,Apple Music,Lyrics,Audio
You,,https://open.spotify.com/track/0KpPAtVW2JHd4pJAZv6tHc,https://www.youtube.com/watch?v=NnfJB5kkr94,https://music.apple.com/us/album/you-single/6809622929,https://genius.com/Lonny-cocoon-you-lyrics,`;

const $=id=>document.getElementById(id);
const audio=$("audio");
let songs=[],i=0,playing=-1;

function parseCSV(t){
  const rows=[];let r=[],f="",q=false;
  for(let k=0;k<t.length;k++){const c=t[k];
    if(q){if(c=='"'){if(t[k+1]=='"'){f+='"';k++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==","){r.push(f);f=""}
    else if(c=="\n"||c=="\r"){if(c=="\r"&&t[k+1]=="\n")k++;r.push(f);rows.push(r);r=[];f=""}
    else f+=c}
  if(f||r.length){r.push(f);rows.push(r)}
  const h=rows.shift().map(x=>x.trim().toLowerCase());
  return rows.filter(r=>r.some(x=>x.trim())).map(r=>{const o={};h.forEach((k,n)=>o[k]=(r[n]||"").trim());return o});
}
// GitHub "blob" pages and Google Drive share links -> direct audio URLs
function audioURL(u){
  if(!u)return"";
  let m=u.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/(?:blob|raw)\/(.+)$/);
  if(m)return`https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3].split("?")[0].split("/").map(s=>encodeURIComponent(decodeURIComponent(s))).join("/")}`;
  m=u.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  if(m)return`https://drive.google.com/uc?export=download&id=${m[1]}`;
  return u;
}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const fmt=s=>isFinite(s)?Math.floor(s/60)+":"+pad(Math.floor(s%60)):"0:00";

function setCover(el,s){
  if(s.artwork){el.style.backgroundImage=`url("${s.artwork}")`;el.classList.remove("novinyl")}
  else{el.style.backgroundImage="";el.classList.add("novinyl")}
}
function render(){
  const s=songs[i];
  $("count").textContent=songs.length;
  $("prog").style.width=((i+1)/songs.length*100)+"%";
  $("title").textContent=s.title;
  const links=[["spotify",s.spotify],["youtube",s.youtube],["apple music",s["apple music"]],["lyrics",s.lyrics]].filter(x=>x[1])
    .map(x=>`<a href="${esc(x[1])}" target="_blank" rel="noopener">${x[0]}</a>`).join(" · ");
  $("meta").innerHTML=`<dt>Release ${pad(i+1)}</dt> <dd>/ ${pad(songs.length)}</dd><br><dt>Format:</dt> <dd>${s.audio?"stream":"single"}</dd><br><dt>Listen on:</dt> <dd>${links||"—"}</dd>`;
  const c=$("cover");setCover(c,s);c.classList.remove("fade");void c.offsetWidth;c.classList.add("fade");
  $("tag").textContent=s.audio?"play here":"single";
  const b=$("listen");
  if(s.audio){b.disabled=false;b.innerHTML=(playing===i&&!audio.paused?"❚❚ pause":"▶ listen here")}
  else{b.disabled=true;b.textContent="stream on spotify ↑"}
  $("sleeve").classList.toggle("spin",playing===i&&!audio.paused);
}
function go(d){i=(i+d+songs.length)%songs.length;render()}

function play(n){
  const s=songs[n];if(!s||!s.audio)return;
  if(playing===n){audio.paused?audio.play():audio.pause();return}
  playing=n;audio.src=audioURL(s.audio);audio.play().catch(()=>{});
  $("ptitle").textContent=s.title;$("player").classList.add("on");
}
function step(d){ // skip to next song that has audio
  const p=songs.map((s,k)=>k).filter(k=>songs[k].audio);if(!p.length)return;
  let at=p.indexOf(playing);at=at<0?0:(at+d+p.length)%p.length;
  const n=p[at];playing=-1;play(n);i=n;render();
}
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
$("listen").onclick=()=>{play(i);render()};
$("pp").onclick=()=>audio.paused?audio.play():audio.pause();
$("pb").onclick=()=>step(-1);$("pn").onclick=()=>step(1);
$("x").onclick=()=>{audio.pause();$("player").classList.remove("on");playing=-1;render()};
$("va").onclick=()=>{$("all").hidden=false;$("all").scrollIntoView()};
audio.onplay=audio.onpause=()=>{$("pp").textContent=audio.paused?"▶":"❚❚";render()};
audio.onended=()=>step(1);
audio.onloadedmetadata=()=>$("dur").textContent=fmt(audio.duration);
audio.ontimeupdate=()=>{$("cur").textContent=fmt(audio.currentTime);if(audio.duration)$("range").value=audio.currentTime/audio.duration*100};
audio.onerror=()=>{$("ptitle").textContent=(songs[playing]?.title||"")+" — can't load audio"};
$("range").oninput=e=>{if(audio.duration)audio.currentTime=e.target.value/100*audio.duration};
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;
  if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1)});

function build(){
  $("msg").hidden=true;$("stage").hidden=false;$("va").hidden=false;$("all").hidden=true;
  $("grid").innerHTML=songs.map((s,k)=>`<button class="card" data-k="${k}"><div class="c${s.artwork?"":" novinyl"}" style="${s.artwork?`background-image:url('${esc(s.artwork)}')`:""}"></div><b>${esc(s.title)}</b><span>${s.audio?"▶ play":"single"}</span></button>`).join("");
  document.querySelectorAll(".card").forEach(c=>c.onclick=()=>{i=+c.dataset.k;render();songs[i].audio?play(i):0;scrollTo({top:0,behavior:"smooth"})});
  render();
}
fetch(SHEET).then(r=>r.text()).then(t=>{songs=parseCSV(t)}).catch(()=>{songs=parseCSV(FALLBACK)})
  .then(()=>{songs=songs.filter(s=>s.title);if(!songs.length)songs=parseCSV(FALLBACK);build()});
</script>
</body>
</html>
