<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lonny cocoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{--ink:#141414;--orange:#f5a623;--grey:#e9e9e9}
*{box-sizing:border-box;margin:0}
body{background:#fff;color:var(--ink);font-family:"Archivo Narrow",Arial,sans-serif;padding-bottom:120px}
.heavy{font-family:"Archivo Black","Arial Black",Impact,sans-serif;font-weight:400;text-transform:lowercase}
header{display:flex;justify-content:space-between;align-items:center;padding:24px 5vw}
header .logo{font-size:1.2rem;color:var(--ink);text-decoration:none}
nav a{margin-left:22px;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);text-decoration:none}
nav a:hover{text-decoration:underline}
.hero{text-align:center;padding:40px 5vw 10px}
.count{font-family:"Archivo Black",sans-serif;font-size:1.5rem}
.hero h1{font-size:clamp(2.4rem,7vw,4rem);line-height:1.05}
.hero small{display:block;margin-top:8px;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;opacity:.65}
.line{width:min(520px,80vw);height:2px;background:linear-gradient(90deg,var(--ink) 75%,var(--orange) 75%);margin:30px auto 0}
.queue{display:flex;flex-direction:column;align-items:center;gap:64px;padding:60px 5vw 40px}
.item{background:none;border:0;cursor:pointer;font:inherit;color:inherit;text-align:center;width:min(340px,78vw)}
.sleeve{position:relative;width:100%;aspect-ratio:1;margin-bottom:22px}
.rec{position:absolute;top:2%;left:4%;width:96%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#0d0d0d 0 2px,#1d1d1d 2px 4px);box-shadow:0 6px 18px rgba(0,0,0,.3);transition:left .35s}
.rec::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--orange);box-shadow:0 0 0 10px #0d0d0d inset}
.item:hover .rec{left:26%}
.cover{position:absolute;inset:0;background:#222 center/cover;box-shadow:0 10px 28px rgba(0,0,0,.28);transition:transform .35s}
.item:hover .cover{transform:translateX(-8%)}
.cover.nv,.big .nv{background:radial-gradient(circle,var(--orange) 0 9%,#0d0d0d 9.5% 10%,transparent 10.5%),repeating-radial-gradient(circle,#0d0d0d 0 2px,#1d1d1d 2px 4px);border-radius:50%}
.item h2{font-size:1.35rem;line-height:1.5}
.item h2 span,.modal h2 span{background:var(--ink);color:#fff;padding:2px 10px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.msg{text-align:center;padding:60px 5vw;opacity:.6}
footer{text-align:center;padding:50px 5vw 30px;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase}
footer a{color:var(--ink);margin:0 12px}
/* popup */
.overlay{position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:15;display:none;overflow:auto;padding:30px 5vw 130px}
.overlay.on{display:block;animation:in .25s}
@keyframes in{from{opacity:0}}
.modal{max-width:820px;margin:30px auto 0;display:flex;gap:6vw;align-items:center;justify-content:center;position:relative}
.big{position:relative;width:min(320px,70vw);aspect-ratio:1;flex:none;margin-right:16%}
.big .rec{left:auto;right:-34%;top:2%;transition:none}
.big.spin .rec{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.big .cover{transition:none}
.details{width:260px}
.by{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.modal h2{font-size:1.6rem;line-height:1.55;margin:8px 0 16px}
.rule{width:34px;height:3px;background:var(--ink);margin:0 0 14px}
dl{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;line-height:1.9}
dt{display:inline;font-weight:600}dd{display:inline;opacity:.75}dd a{color:inherit}
.playbtn{margin-top:20px;background:var(--orange);color:var(--ink);border:0;padding:12px 22px;font:inherit;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.playbtn:disabled{background:var(--grey);color:#777;cursor:default}
.close{position:fixed;top:18px;right:5vw;background:none;border:1.5px solid var(--ink);border-radius:50%;width:38px;height:38px;font-size:1rem;cursor:pointer;z-index:16}
.navs{display:flex;justify-content:center;gap:50px;margin-top:40px}
.navs button{background:none;border:0;font-size:2.2rem;cursor:pointer}
/* player */
#player{position:fixed;left:2.5vw;right:2.5vw;bottom:16px;background:var(--orange);display:flex;align-items:center;gap:14px;padding:12px 18px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.2);transform:translateY(170%);transition:transform .4s}
#player.on{transform:none}
#player button{background:none;border:0;color:var(--ink);cursor:pointer;font-size:1rem;padding:4px 6px}
#pp{width:38px;height:38px;border-radius:50%;background:#fff!important;display:grid;place-items:center}
.now{min-width:130px;line-height:1.2}.now small{display:block;font-size:.55rem;letter-spacing:.14em;text-transform:uppercase}.now b{font-size:.9rem}
.seek{flex:1;display:flex;align-items:center;gap:10px;font-size:.62rem}.seek input{flex:1;accent-color:var(--ink);cursor:pointer}
#x{border:1.5px solid var(--ink)!important;border-radius:50%;width:32px;height:32px}
@media(max-width:760px){
 .modal{flex-direction:column;gap:30px;text-align:center}.big{margin-right:0;margin-left:0}.big .rec{right:-22%}
 .details{width:100%;max-width:320px}.now{min-width:0;flex:1}.seek .t{display:none}
}
</style>
</head>
<body>
<header>
  <a class="logo heavy" href="#">lonny cocoon</a>
  <nav><a href="https://www.instagram.com/lonny.cocoon" target="_blank" rel="noopener">instagram</a><a href="https://www.youtube.com/@lonny.cocoon" target="_blank" rel="noopener">youtube</a><a href="https://open.spotify.com/intl-ar/artist/2VlAixpjMhZHEjXmwmjEd7" target="_blank" rel="noopener">spotify</a></nav>
</header>

<section class="hero">
  <div class="count" id="count">&nbsp;</div>
  <h1 class="heavy">audio</h1>
  <small>songs by lonny cocoon</small>
  <div class="line"></div>
</section>

<div id="msg" class="msg">loading songs…</div>
<main class="queue" id="queue"></main>

<footer>
  <a href="https://www.instagram.com/lonny.cocoon" target="_blank" rel="noopener">instagram</a>
  <a href="https://www.youtube.com/@lonny.cocoon" target="_blank" rel="noopener">youtube</a>
  <a href="https://open.spotify.com/intl-ar/artist/2VlAixpjMhZHEjXmwmjEd7" target="_blank" rel="noopener">spotify</a>
  <div style="margin-top:18px;opacity:.55">© lonny cocoon</div>
</footer>

<div class="overlay" id="ov">
  <button class="close" id="cl" aria-label="Close">✕</button>
  <div class="modal">
    <div class="big" id="big"><div class="rec"></div><div class="cover" id="cv"></div></div>
    <div class="details">
      <div class="by">by lonny cocoon</div>
      <h2 class="heavy"><span id="mt"></span></h2>
      <div class="rule"></div>
      <dl id="mm"></dl>
      <button class="playbtn" id="lb"></button>
    </div>
  </div>
  <div class="navs"><button id="pv" aria-label="Previous">←</button><button id="nx" aria-label="Next">→</button></div>
</div>

<div id="player">
  <button id="pb" aria-label="Previous song">⏮</button>
  <button id="pp" aria-label="Play or pause">▶</button>
  <button id="pn" aria-label="Next song">⏭</button>
  <div class="now"><small>lonny cocoon</small><b class="heavy" id="pt"></b></div>
  <div class="seek"><span id="cur">0:00</span><input id="range" type="range" min="0" max="100" value="0" step=".1"><span class="t" id="dur">0:00</span></div>
  <button id="x" aria-label="Close player">✕</button>
</div>
<audio id="audio" preload="none"></audio>

<script>
const SHEET="https://docs.google.com/spreadsheets/d/e/2PACX-1vRRbwiag08mbEM7VifXGVx5y8wCkarQSNcr4Ug7-2gbofo31SUHsiJrv61F5W1-gFzISBVkSlTGcJuB/pub?output=csv";
const FALLBACK=`Title,Artwork,Spotify,YouTube,Apple Music,Lyrics,Audio
You,,https://open.spotify.com/track/0KpPAtVW2JHd4pJAZv6tHc,https://www.youtube.com/watch?v=NnfJB5kkr94,https://music.apple.com/us/album/you-single/6809622929,https://genius.com/Lonny-cocoon-you-lyrics,`;
const $=id=>document.getElementById(id), audio=$("audio");
let songs=[],i=0,playing=-1;
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const fmt=s=>isFinite(s)?Math.floor(s/60)+":"+pad(Math.floor(s%60)):"0:00";

function parseCSV(t){
  const rows=[];let r=[],f="",q=false;
  for(let k=0;k<t.length;k++){const c=t[k];
    if(q){if(c=='"'){if(t[k+1]=='"'){f+='"';k++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==","){r.push(f);f=""}
    else if(c=="\n"||c=="\r"){if(c=="\r"&&t[k+1]=="\n")k++;r.push(f);rows.push(r);r=[];f=""}
    else f+=c}
  if(f||r.length){r.push(f);rows.push(r)}
  const h=rows.shift().map(x=>x.trim().toLowerCase());
  return rows.filter(r=>r.some(x=>x.trim())).map(r=>{const o={};h.forEach((k,n)=>o[k]=(r[n]||"").trim());return o});
}
function audioURL(u){
  if(!u)return"";
  let m=u.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/(?:blob|raw)\/(.+)$/);
  if(m)return`https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3].split("?")[0].split("/").map(s=>encodeURIComponent(decodeURIComponent(s))).join("/")}`;
  m=u.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  if(m)return`https://drive.google.com/uc?export=download&id=${m[1]}`;
  return u;
}
function cover(el,s){
  if(s.artwork){el.style.backgroundImage=`url("${s.artwork}")`;el.classList.remove("nv")}
  else{el.style.backgroundImage="";el.classList.add("nv")}
}
function build(){
  $("msg").hidden=true;$("count").textContent=songs.length;
  $("queue").innerHTML=songs.map((s,k)=>`<button class="item" data-k="${k}"><div class="sleeve"><div class="rec"></div><div class="cover${s.artwork?"":" nv"}" style="${s.artwork?`background-image:url('${esc(s.artwork)}')`:""}"></div></div><h2 class="heavy"><span>${esc(s.title)}</span></h2></button>`).join("");
  document.querySelectorAll(".item").forEach(b=>b.onclick=()=>openSong(+b.dataset.k));
}
function openSong(k){i=k;fill();$("ov").classList.add("on");document.body.style.overflow="hidden"}
function fill(){
  const s=songs[i];
  $("mt").textContent=s.title;cover($("cv"),s);
  const links=[["spotify",s.spotify],["youtube",s.youtube],["apple music",s["apple music"]],["lyrics",s.lyrics]].filter(x=>x[1])
    .map(x=>`<a href="${esc(x[1])}" target="_blank" rel="noopener">${x[0]}</a>`).join(" · ");
  $("mm").innerHTML=`<dt>Release:</dt> <dd>${pad(i+1)} / ${pad(songs.length)}</dd><br><dt>Format:</dt> <dd>${s.audio?"stream + single":"single"}</dd><br><dt>Listen on:</dt> <dd>${links||"—"}</dd>`;
  const b=$("lb"),on=playing===i&&!audio.paused;
  if(s.audio){b.disabled=false;b.textContent=on?"❚❚ pause":"▶ play"}
  else{b.disabled=true;b.textContent="stream on the links above"}
  $("big").classList.toggle("spin",on);
}
function closeSong(){$("ov").classList.remove("on");document.body.style.overflow=""}
function play(n){
  const s=songs[n];if(!s||!s.audio)return;
  if(playing===n){audio.paused?audio.play():audio.pause();return}
  playing=n;audio.src=audioURL(s.audio);audio.play().catch(()=>{});
  $("pt").textContent=s.title;$("player").classList.add("on");
}
function step(d){
  const p=songs.map((s,k)=>k).filter(k=>songs[k].audio);if(!p.length)return;
  let at=p.indexOf(playing);at=at<0?0:(at+d+p.length)%p.length;
  const n=p[at];playing=-1;play(n);i=n;fill();
}
$("cl").onclick=closeSong;
$("ov").onclick=e=>{if(e.target.id==="ov")closeSong()};
$("pv").onclick=()=>{i=(i-1+songs.length)%songs.length;fill()};
$("nx").onclick=()=>{i=(i+1)%songs.length;fill()};
$("lb").onclick=()=>{play(i);fill()};
$("pp").onclick=()=>audio.paused?audio.play():audio.pause();
$("pb").onclick=()=>step(-1);$("pn").onclick=()=>step(1);
$("x").onclick=()=>{audio.pause();$("player").classList.remove("on");playing=-1;fill()};
audio.onplay=audio.onpause=()=>{$("pp").textContent=audio.paused?"▶":"❚❚";if(songs.length)fill()};
audio.onended=()=>step(1);
audio.onloadedmetadata=()=>$("dur").textContent=fmt(audio.duration);
audio.ontimeupdate=()=>{$("cur").textContent=fmt(audio.currentTime);if(audio.duration)$("range").value=audio.currentTime/audio.duration*100};
audio.onerror=()=>{$("pt").textContent=(songs[playing]?.title||"")+" — can't load audio"};
$("range").oninput=e=>{if(audio.duration)audio.currentTime=e.target.value/100*audio.duration};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSong()});
fetch(SHEET).then(r=>r.text()).then(t=>{songs=parseCSV(t)}).catch(()=>{songs=parseCSV(FALLBACK)})
  .then(()=>{songs=songs.filter(s=>s.title);if(!songs.length)songs=parseCSV(FALLBACK);build()});
</script>
</body>
</html>
